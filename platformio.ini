[env:esp32-wrover]
platform = espressif32@6.7.0          ; стабильная версия, хорошо работает с FabGL
board = esp32dev
framework = arduino
asflags = -target=xtensa-esp32-elf

board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Очень важно — PSRAM отключаем (как требует скетч)
build_flags = 
    -D BOARD_HAS_PSRAM=0
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_SPIRAM_SUPPORT=0

lib_deps = 
    fdivitto/FabGL@^1.0.9

monitor_speed = 115200
